<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eldara campaign dashboard</title>
<style>
  :root {
    --bg: #F1EFE8;
    --card: #FFFFFF;
    --border: #D3D1C7;
    --text-primary: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #888780;
    --accent-warn-bg: #FAEEDA;
    --accent-warn-text: #633806;
    --accent-danger-text: #791F1F;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 20px; }
  textarea {
    width: 100%;
    min-height: 90px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 8px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-primary);
    resize: vertical;
  }
  button {
    font-size: 13px;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-primary);
    cursor: pointer;
  }
  button:hover { background: #F7F5EE; }
  button.primary { font-weight: 500; border-color: #8A8878; }
  .field-label { font-size: 13px; color: var(--text-secondary); margin: 12px 0 4px; }
  .toggles { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .error { font-size: 13px; color: var(--accent-danger-text); margin: 8px 0 0; display: none; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .pill {
    display: inline-block;
    background: var(--accent-warn-bg);
    color: var(--accent-warn-text);
    font-size: 12px;
    padding: 3px 10px;
    border-radius: var(--radius);
    margin: 0 6px 6px 0;
  }
  ul.gear { margin: 0; padding: 0; list-style: none; }
  ul.gear li { padding: 4px 0; border-bottom: 1px solid var(--border); }
  ul.gear li:last-child { border-bottom: none; }
  .npc-row, .thread-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .npc-row:last-child, .thread-row:last-child { border-bottom: none; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .danger-text { color: var(--accent-danger-text); }
  #dashboard-view { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Eldara campaign dashboard</h1>
  <p class="subtitle">A standalone snapshot viewer. Paste in save files exported from the project and reload as needed — nothing here is written back to your campaign.</p>

  <div id="paste-view">
    <p class="field-label">saves/current.json (required)</p>
    <textarea id="current-input" placeholder="Paste saves/current.json here"></textarea>

    <div class="toggles">
      <button id="locations-toggle" type="button">Add locations.json</button>
      <button id="npc-toggle" type="button">Add npc_registry.json</button>
    </div>

    <div id="locations-wrap" style="display:none;">
      <p class="field-label">saves/locations.json (optional)</p>
      <textarea id="locations-input" placeholder="Paste saves/locations.json here"></textarea>
    </div>
    <div id="npc-wrap" style="display:none;">
      <p class="field-label">saves/npc_registry.json (optional)</p>
      <textarea id="npc-input" placeholder="Paste saves/npc_registry.json here"></textarea>
    </div>

    <p id="paste-error" class="error"></p>
    <div style="margin-top: 14px;">
      <button id="render-btn" class="primary" type="button">Show status</button>
    </div>
  </div>

  <div id="dashboard-view"></div>
</div>

<script>
document.getElementById('locations-toggle').addEventListener('click', function () {
  var wrap = document.getElementById('locations-wrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('npc-toggle').addEventListener('click', function () {
  var wrap = document.getElementById('npc-wrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
});

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

document.getElementById('render-btn').addEventListener('click', function () {
  var errEl = document.getElementById('paste-error');
  errEl.style.display = 'none';

  var raw = document.getElementById('current-input').value.trim();
  if (!raw) {
    errEl.textContent = 'Paste the contents of current.json first.';
    errEl.style.display = 'block';
    return;
  }

  var state, locations = null, npcRegistry = null;
  try {
    state = JSON.parse(raw);
  } catch (e) {
    errEl.textContent = 'current.json did not parse as valid JSON.';
    errEl.style.display = 'block';
    return;
  }

  var locRaw = document.getElementById('locations-input').value.trim();
  if (locRaw) {
    try { locations = (JSON.parse(locRaw).locations) || {}; }
    catch (e) {
      errEl.textContent = 'locations.json did not parse as valid JSON.';
      errEl.style.display = 'block';
      return;
    }
  }

  var npcRaw = document.getElementById('npc-input').value.trim();
  if (npcRaw) {
    try { npcRegistry = JSON.parse(npcRaw); }
    catch (e) {
      errEl.textContent = 'npc_registry.json did not parse as valid JSON.';
      errEl.style.display = 'block';
      return;
    }
  }

  render(state, locations, npcRegistry);
});

function render(state, locations, npcRegistry) {
  document.getElementById('paste-view').style.display = 'none';
  var view = document.getElementById('dashboard-view');
  view.style.display = 'block';

  var date = state.in_world_date || {};
  var dateStr = 'Day ' + esc(date.day) + ' of ' + esc(date.month) + ', Year ' + esc(date.year);

  var locName = state.current_location;
  if (locations && locations[state.current_location]) {
    locName = locations[state.current_location].name || state.current_location;
  }

  var travelHtml = '';
  if (state.travel && state.travel.destination) {
    var destName = state.travel.destination;
    if (locations && locations[state.travel.destination]) {
      destName = locations[state.travel.destination].name || destName;
    }
    var eta = state.travel.eta_date;
    var etaStr = eta ? ('day ' + esc(eta.day) + ' of ' + esc(eta.month)) : 'unknown';
    var daysLeft = null;
    if (eta && date.month && eta.month === date.month && eta.year === date.year) {
      daysLeft = eta.day - date.day;
    }
    travelHtml = '<div class="row" style="margin-top:8px; font-size:13px; color:var(--text-secondary);">'
      + '<span>In transit to <strong style="color:var(--text-primary);">' + esc(destName) + '</strong>'
      + ' &middot; ETA ' + etaStr
      + (daysLeft !== null ? ' (' + (daysLeft <= 0 ? 'due' : daysLeft + ' day' + (daysLeft === 1 ? '' : 's')) + ')' : '')
      + '</span></div>';
  }

  var currency = state.currency || {};
  var currencyParts = [];
  ['platinum', 'gold', 'silver', 'copper'].forEach(function (denom) {
    var v = currency[denom];
    if (v) currencyParts.push(esc(v) + ' ' + denom);
  });
  var currencyStr = currencyParts.length ? currencyParts.join(' &middot; ') : 'none';

  var gear = state.gear || [];
  var gearHtml = gear.length ? gear.map(function (g) {
    var cond = g.condition ? ' <span class="muted">(' + esc(g.condition) + ')</span>' : '';
    return '<li>' + esc(g.name) + cond + '</li>';
  }).join('') : '<li class="muted">No gear tracked.</li>';

  var status = state.status || [];
  var statusHtml = status.length
    ? status.map(function (s) { return '<span class="pill">' + esc(s) + '</span>'; }).join('')
    : '<span class="muted">No active injuries or conditions.</span>';

  var npcs = state.npc_relationships || [];
  var npcHtml = npcs.length ? npcs.map(function (n) {
    var disp = n.disposition ? ' &mdash; ' + esc(n.disposition) : '';
    var recency = n.last_referenced_turn != null
      ? '<span class="muted">turn ' + esc(n.last_referenced_turn) + '</span>' : '';
    return '<div class="npc-row"><span>' + esc(n.name) + '<span class="muted">' + disp + '</span></span>' + recency + '</div>';
  }).join('') : '<p class="muted">No tracked NPCs yet.</p>';

  var threads = state.open_threads || [];
  var threadHtml = threads.length ? threads.map(function (t) {
    var deadline = '';
    if (t.deadline_turn != null) {
      var turnsLeft = t.deadline_turn - (state.turn || 0);
      var overdue = turnsLeft < 0;
      deadline = '<span class="' + (overdue ? 'danger-text' : 'muted') + '">'
        + (overdue ? 'overdue' : 'due turn ' + esc(t.deadline_turn)) + '</span>';
    }
    return '<div class="thread-row"><span>' + esc(t.text) + '</span>' + deadline + '</div>';
  }).join('') : '<p class="muted">No open threads.</p>';

  var html = ''
    + '<div class="card">'
    +   '<div class="row"><span style="font-size:15px; font-weight:500;">' + dateStr + '</span>'
    +   '<span class="muted">Turn ' + esc(state.turn) + '</span></div>'
    +   (locName ? '<div style="margin-top:8px; font-size:14px;">' + esc(locName) + '</div>' : '')
    +   travelHtml
    + '</div>'

    + '<div class="card"><h2>Status</h2><div>' + statusHtml + '</div></div>'

    + '<div class="card"><h2>Gear</h2><ul class="gear">' + gearHtml + '</ul>'
    +   '<p style="font-size:13px; margin:10px 0 0; color:var(--text-secondary);">Currency: ' + currencyStr + '</p>'
    + '</div>'

    + '<div class="card"><h2>Key NPCs</h2>' + npcHtml + '</div>'

    + '<div class="card"><h2>Open threads</h2>' + threadHtml + '</div>'

    + '<button id="reset-btn" type="button">Paste different data</button>';

  view.innerHTML = html;
  document.getElementById('reset-btn').addEventListener('click', function () {
    view.style.display = 'none';
    document.getElementById('paste-view').style.display = 'block';
  });
}
</script>
</body>
</html>
